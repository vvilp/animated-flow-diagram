<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagram</title>
<style>
  :root { --bg:#f5f6fb; --ink:#141824; --muted:#5b6478; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--ink);
    font-family:ui-sans-serif,-apple-system,"Inter","SF Pro Text",system-ui,sans-serif; }
  body { min-height:100vh; background:
      radial-gradient(60% 50% at 15% 0%, rgba(45,212,191,.20), transparent 70%),
      radial-gradient(50% 50% at 95% 100%, rgba(167,139,250,.24), transparent 70%),
      var(--bg); }
  .wrap { max-width:1180px; margin:0 auto; padding:clamp(16px,4vw,44px) 16px; }
  header { margin:0 4px 20px; }
  .eyebrow { font:600 11.5px ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.16em; text-transform:uppercase; color:#0f9488; }
  h1 { font-size:clamp(24px,4vw,38px); font-weight:700; letter-spacing:-.02em; margin:6px 0 6px;
       background:linear-gradient(90deg,#0f172a,#4338ca 60%,#9333ea); -webkit-background-clip:text; background-clip:text; color:transparent; }
  header p { margin:0; color:var(--muted); font-size:clamp(13px,1.7vw,15.5px); max-width:60ch; line-height:1.5; }
  .card { border-radius:24px; padding:6px; border:1px solid rgba(20,30,70,.08);
    background:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.55));
    box-shadow:0 30px 70px -30px rgba(40,50,110,.30), inset 0 1px 0 #fff; }
  svg { width:100%; height:auto; display:block; }
  .title { font:600 14px ui-sans-serif,-apple-system,"Inter",system-ui,sans-serif; fill:#141824; }
  .sub   { font:500 10.5px ui-monospace,"SF Mono",Menlo,monospace; fill:#5b6478; }
  .lane  { font:600 11px ui-monospace,"SF Mono",Menlo,monospace; letter-spacing:.16em; fill:#5b6478; }
  .elabel{ font:500 10.5px ui-monospace,"SF Mono",Menlo,monospace; fill:#5b6478; paint-order:stroke; stroke:#f4f5fb; stroke-width:5px; }
  .flow  { fill:none; stroke-width:1.5; stroke-dasharray:1.5 9; stroke-linecap:round; animation:march 1.2s linear infinite; }
  @keyframes march { to { stroke-dashoffset:-10.5; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation:none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Architecture</div>
    <h1>Retrieval-augmented generation</h1>
    <p>Documents are embedded once, offline. At question time, hybrid retrieval pulls the best chunks, a reranker sharpens them, and the model answers with citations.</p>
  </header>
  <div class="card"><svg id="d" role="img"></svg></div>
</div>

<script>
/* =====================================================================
   SPEC — the only part you should need to edit.
   Nodes: {x,y} is the top-left corner. icon = key of ICONS below.
   ===================================================================== */
const SPEC = {
  label: "RAG pipeline: offline indexing feeds online query answering",
  view: [1200, 590],
  lanes: [
    { x:16, y:26,  w:1168, h:172, tone:"cyan",   title:"INDEXING · OFFLINE" },
    { x:16, y:262, w:1168, h:308, tone:"violet", title:"QUERY · ONLINE" },
  ],
  nodes: [
    { id:"docs",  x:44,   y:92,  w:160, h:76, tone:"cyan",   icon:"doc",    t:"Documents",  s:"pdf · web" },
    { id:"chunk", x:254,  y:92,  w:150, h:76, tone:"cyan",   icon:"grid",   t:"Chunk",      s:"512 tokens" },
    { id:"emb1",  x:464,  y:92,  w:150, h:76, tone:"cyan",   icon:"embed",  t:"Embed",      s:"to vectors" },
    { id:"vdb",   x:674,  y:92,  w:170, h:76, tone:"cyan",   icon:"db",     t:"Vector store", s:"HNSW index" },

    { id:"q",     x:44,   y:400, w:160, h:76, tone:"violet", icon:"search", t:"User query", s:"free text" },
    { id:"emb2",  x:250,  y:400, w:130, h:76, tone:"violet", icon:"embed",  t:"Embed",      s:"same model" },
    { id:"vec",   x:424,  y:332, w:176, h:76, tone:"blue",   icon:"vector", t:"Vector search", s:"top-k" },
    { id:"kw",    x:424,  y:468, w:176, h:76, tone:"blue",   icon:"text",   t:"Keyword search", s:"BM25" },
    { id:"rank",  x:654,  y:400, w:140, h:76, tone:"violet", icon:"rank",   t:"Rerank",     s:"rescore" },
    { id:"llm",   x:844,  y:400, w:140, h:76, tone:"amber",  icon:"spark",  t:"LLM",        s:"grounded" },
    { id:"ans",   x:1034, y:400, w:134, h:76, tone:"green",  icon:"check",  t:"Answer",     s:"cited" },
  ],
  edges: [
    { id:"a1", from:"docs",  to:"chunk", tone:"cyan" },
    { id:"a2", from:"chunk", to:"emb1",  tone:"cyan" },
    { id:"a3", from:"emb1",  to:"vdb",   tone:"cyan" },
    { id:"lk", from:"vdb",   to:"vec",   tone:"blue", mode:"down", label:"lookup", mid:262 },
    { id:"b1", from:"q",     to:"emb2",  tone:"violet" },
    { id:"b2", from:"emb2",  to:"vec",   tone:"violet", label:"dense" },
    { id:"b3", from:"emb2",  to:"kw",    tone:"violet", label:"sparse" },
    { id:"b4", from:"vec",   to:"rank",  tone:"violet" },
    { id:"b5", from:"kw",    to:"rank",  tone:"violet" },
    { id:"b6", from:"rank",  to:"llm",   tone:"amber" },
    { id:"b7", from:"llm",   to:"ans",   tone:"green" },
  ],
  // [edgeId, startSec, durationSec]
  timeline: { cycle:9.5, steps:[
    ["a1",.3,.8], ["a2",1.1,.8], ["a3",1.9,.8],
    ["lk",3.2,1.0],
    ["b1",3.4,.7], ["b2",4.1,.8], ["b3",4.1,.8],
    ["b4",4.9,.7], ["b5",4.9,.7], ["b6",5.7,.7], ["b7",6.5,.8],
  ]},
};

/* =====================================================================
   ENGINE — no edits needed below this line.
   ===================================================================== */
const NS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("d");
const TONE = { // accent, accent (soft) — used for strokes, glow, icons, particles
  cyan:"#0d9488", blue:"#2563eb", violet:"#7c3aed", amber:"#d97706", green:"#16a34a",
};
const ICONS = { // 20×20 grid, stroke-only
  doc:   "M5 2.5h7l4 4v11H5z M12 2.5v4h4 M7.5 10h6 M7.5 13h6",
  grid:  "M3.5 3.5h5v5h-5z M11.5 3.5h5v5h-5z M3.5 11.5h5v5h-5z M11.5 11.5h5v5h-5z",
  embed: "M4 5.5a1.5 1.5 0 1 0 .01 0 M15 3.5a1.5 1.5 0 1 0 .01 0 M10 10a1.5 1.5 0 1 0 .01 0 M5 16a1.5 1.5 0 1 0 .01 0 M16 15a1.5 1.5 0 1 0 .01 0 M5.3 6.8l3.6 2.2 M11.2 9l3.2-4.2 M10.9 10.9l3.9 3 M8.9 11l-2.7 3.9",
  db:    "M4 5.5c0-1.1 2.7-2 6-2s6 .9 6 2-2.7 2-6 2-6-.9-6-2z M4 5.5v9c0 1.1 2.7 2 6 2s6-.9 6-2v-9 M4 10c0 1.1 2.7 2 6 2s6-.9 6-2",
  search:"M8.5 3.5a5 5 0 1 0 .01 0 M12.3 12.3l4.2 4.2",
  vector:"M3 16.5L17 3.5 M11 3.5h6v6 M3 10.5l4 0 M3 13.5h2",
  text:  "M3.5 15.5l4-11 4 11 M5 11.5h5 M13 8.5h3.5 M13 11.5h3.5 M13 14.5h3.5",
  rank:  "M4 16V10 M8.5 16V6 M13 16V12 M17 16V3.5",
  spark: "M10 2.5l1.8 5.7 5.7 1.8-5.7 1.8L10 17.5l-1.8-5.7L2.5 10l5.7-1.8z",
  check: "M4 10.5l4 4 8-9",
};
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, attrs = {}, parent = svg, text) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text != null) e.textContent = text;
  parent.appendChild(e); return e;
}
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${n>>8&255},${n&255},${a})`; };

svg.setAttribute("viewBox", `0 0 ${SPEC.view[0]} ${SPEC.view[1]}`);
svg.setAttribute("aria-label", SPEC.label);

/* ---- defs: blur filters, arrow markers, background gradient ---- */
const defs = el("defs");
const blur = (id, sd) => { const f = el("filter",{id,x:"-80%",y:"-80%",width:"260%",height:"260%"},defs); el("feGaussianBlur",{stdDeviation:sd},f); };
blur("soft", 10); blur("tight", 3);
const marker = {};
function markerFor(tone) {
  if (marker[tone]) return marker[tone];
  const id = "m" + tone;
  const m = el("marker",{id,viewBox:"0 0 10 10",refX:7,refY:5,markerWidth:7,markerHeight:7,orient:"auto"},defs);
  el("path",{d:"M2 1.5 L7.5 5 L2 8.5",fill:"none",stroke:TONE[tone],"stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round",opacity:.85},m);
  return marker[tone] = `url(#${id})`;
}
const laneGrad = t => {
  const id = "lg" + t, g = el("linearGradient",{id,x1:0,y1:0,x2:1,y2:1},defs);
  el("stop",{offset:0,"stop-color":TONE[t],"stop-opacity":.09},g);
  el("stop",{offset:1,"stop-color":TONE[t],"stop-opacity":.015},g);
  return `url(#${id})`;
};
const strokeGrad = t => {
  const id = "sg" + t, g = el("linearGradient",{id,x1:0,y1:0,x2:0,y2:1},defs);
  el("stop",{offset:0,"stop-color":TONE[t],"stop-opacity":.6},g);
  el("stop",{offset:1,"stop-color":TONE[t],"stop-opacity":.18},g);
  return `url(#${id})`;
};

/* ---- lanes ---- */
SPEC.lanes.forEach(l => {
  el("rect",{x:l.x,y:l.y,width:l.w,height:l.h,rx:20,fill:laneGrad(l.tone),stroke:hexA(TONE[l.tone],.16),"stroke-width":1});
  el("circle",{cx:l.x+28,cy:l.y+27,r:3.5,fill:TONE[l.tone]});
  el("text",{x:l.x+40,y:l.y+31,class:"lane"},svg,l.title);
});

/* ---- edges ---- */
const N = Object.fromEntries(SPEC.nodes.map(n => [n.id, n]));
function route(e) {
  const A = N[e.from], B = N[e.to], R = 12;
  if (e.mode === "down") { // bottom of A → top of B, elbow at y = mid
    const x1 = A.x + A.w/2, y1 = A.y + A.h, x2 = B.x + B.w/2, y2 = B.y, m = e.mid ?? (y1+y2)/2, s = Math.sign(x2-x1);
    return { d:`M${x1} ${y1} V${m-R} Q${x1} ${m} ${x1+s*R} ${m} H${x2-s*R} Q${x2} ${m} ${x2} ${m+R} V${y2}`, lx:(x1+x2)/2, ly:m };
  }
  const x1 = A.x + A.w, y1 = A.y + A.h/2, x2 = B.x, y2 = B.y + B.h/2;
  if (Math.abs(y1-y2) < 1) return { d:`M${x1} ${y1} H${x2}`, lx:(x1+x2)/2, ly:y1 };
  const m = (x1+x2)/2, s = Math.sign(y2-y1), r = Math.min(R, Math.abs(y2-y1)/2);
  return { d:`M${x1} ${y1} H${m-r} Q${m} ${y1} ${m} ${y1+s*r} V${y2-s*r} Q${m} ${y2} ${m+r} ${y2} H${x2}`, lx:m, ly:(y1+y2)/2 };
}
const edges = {};
SPEC.edges.forEach(e => {
  const r = route(e), c = TONE[e.tone];
  el("path",{d:r.d,fill:"none",stroke:hexA(c,.22),"stroke-width":1.5,"stroke-linecap":"round","marker-end":markerFor(e.tone)});
  const p = el("path",{d:r.d,class:"flow",stroke:hexA(c,.7)});
  if (e.label) {
    const A = N[e.from], B = N[e.to];
    const lx = e.mode === "down" ? r.lx + 44 : r.lx, ly = e.mode === "down" ? r.ly - 8 : r.ly + (B.y > A.y ? 20 : -12) + (B.y > A.y ? 0 : 0);
    el("text",{x:e.mode==="down"?lx:lx,y:ly,"text-anchor":"middle",class:"elabel"},svg,e.label);
  }
  edges[e.id] = { path:p, len:p.getTotalLength(), tone:e.tone, from:e.from, to:e.to };
});

/* ---- nodes ---- */
const nodes = {};
SPEC.nodes.forEach(n => {
  const c = TONE[n.tone], g = el("g");
  const glow = el("rect",{x:n.x,y:n.y,width:n.w,height:n.h,rx:16,fill:c,opacity:0,filter:"url(#soft)"},g);
  el("rect",{x:n.x,y:n.y+6,width:n.w,height:n.h,rx:16,fill:"#28325f",opacity:.16,filter:"url(#tight)"},g);
  el("rect",{x:n.x,y:n.y,width:n.w,height:n.h,rx:16,fill:"#ffffff"},g);
  const tint = el("rect",{x:n.x,y:n.y,width:n.w,height:n.h,rx:16,fill:c,opacity:.05},g);
  const edge = el("rect",{x:n.x+.5,y:n.y+.5,width:n.w-1,height:n.h-1,rx:15.5,fill:"none",stroke:strokeGrad(n.tone),"stroke-width":1},g);
  const ring = el("rect",{x:n.x+.5,y:n.y+.5,width:n.w-1,height:n.h-1,rx:15.5,fill:"none",stroke:c,"stroke-width":1.6,opacity:0},g);
  // icon chip
  const cx = n.x + 16, cy = n.y + n.h/2 - 18;
  el("rect",{x:cx,y:cy,width:36,height:36,rx:11,fill:hexA(c,.14),stroke:hexA(c,.35),"stroke-width":1},g);
  el("path",{d:ICONS[n.icon],transform:`translate(${cx+8} ${cy+8})`,fill:"none",stroke:c,"stroke-width":1.6,"stroke-linecap":"round","stroke-linejoin":"round"},g);
  // text must stay inside the card: shrink font until it fits
  const room = n.x + n.w - 12 - (cx + 48);
  const fit = (t, size) => { while (t.getComputedTextLength() > room && size > 9) t.style.fontSize = (size -= .5) + "px"; };
  fit(el("text",{x:cx+48,y:n.y+n.h/2-3,class:"title"},g,n.t), 14);
  fit(el("text",{x:cx+48,y:n.y+n.h/2+14,class:"sub"},g,n.s), 10.5);
  nodes[n.id] = { glow, tint, ring };
});

/* ---- particles: a comet (head + fading tail) per edge, drawn on top ---- */
const TAIL = 9, STEP = 6;
const comets = {};
for (const id in edges) {
  const c = TONE[edges[id].tone], g = el("g",{opacity:0});
  const halo = el("circle",{r:9,fill:c,opacity:.55,filter:"url(#tight)"},g);
  const tail = Array.from({length:TAIL}, (_, i) => el("circle",{r:3.6-i*.3,fill:c,opacity:(1-i/TAIL)*.7},g));
  const head = el("circle",{r:3.6,fill:"#fff",stroke:c,"stroke-width":1.5},g);
  comets[id] = { g, halo, tail, head };
}

/* ---- activation: a node lights up when a particle arrives (or departs, for sources) ---- */
const T = SPEC.timeline, HOLD = 1.3;
const incoming = new Set(T.steps.map(([id]) => edges[id].to));
const hits = [];
{
  const seen = new Set();
  T.steps.forEach(([id,s,d]) => {
    const {from,to} = edges[id];
    if (!incoming.has(from) && !seen.has(from)) { hits.push([from, s]); seen.add(from); }
    hits.push([to, s+d]);
  });
}

function frame(tm) {
  const tt = tm % T.cycle;
  T.steps.forEach(([id,s,d]) => {
    const E = edges[id], C = comets[id], p = (tt - s) / d;
    if (p > 0 && p < 1) {
      const ease = p < .5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2; // in-out, feels like it "travels"
      const at = q => E.path.getPointAtLength(Math.max(0, E.len*ease - q));
      const h = at(0);
      C.head.setAttribute("cx",h.x); C.head.setAttribute("cy",h.y);
      C.halo.setAttribute("cx",h.x); C.halo.setAttribute("cy",h.y);
      C.tail.forEach((c,i) => { const pt = at((i+1)*STEP); c.setAttribute("cx",pt.x); c.setAttribute("cy",pt.y); });
      C.g.setAttribute("opacity", Math.min(1, p*8, (1-p)*8));
    } else C.g.setAttribute("opacity",0);
  });
  const lit = {};
  hits.forEach(([id,at]) => {
    const a = tt - at;
    if (a > 0 && a < HOLD) lit[id] = Math.max(lit[id]||0, Math.pow(1 - a/HOLD, 1.6));
  });
  for (const id in nodes) {
    const v = lit[id] || 0, n = nodes[id];
    n.glow.setAttribute("opacity", v*.35); n.ring.setAttribute("opacity", v); n.tint.setAttribute("opacity", .05 + v*.14);
  }
}

// Reduced motion: leave the diagram static.
if (!reduce) {
  const t0 = performance.now();
  const loop = now => { frame((now - t0)/1000); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
</script>
</body>
</html>
